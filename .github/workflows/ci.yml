name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      # Type-check .astro + .ts via the canonical Astro tool. Restores the
      # .astro type coverage ESLint can't provide (type-checked rules are
      # disabled for .astro — astro-eslint-parser crashes on frontmatter returns).
      - run: npm run check
      - run: npm run lint
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # Per-account data-isolation gate (Foundation F-01). Spins up only the
      # services the tests need — postgres + gotrue (auth) + postgrest (rest) +
      # kong (gateway) + mailpit (mailer) — and runs the cross-account RLS test
      # as a merge-blocking check. The local-stack keys are fixed public demo
      # JWTs, so no GitHub secrets are required here. Docker is preinstalled on
      # the ubuntu-latest runner.
      #
      # mailpit is NOT excluded: without a mail server GoTrue fails every send,
      # so `resetPasswordForEmail` errors and the password-reset request route
      # redirects to ?error= instead of ?sent=1. Dropping it turned CI red while
      # the same suites passed locally, where mailpit runs by default.
      - name: Start Supabase (local stack — db + auth + rest + mailer)
        # Pull the stack from Docker Hub: public.ecr.aws answers "toomanyrequests: Data limit exceeded" to runners.
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: >-
          npx supabase start -x
          realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      # Apply migrations explicitly so the gate can't silently run against a
      # table-less DB (don't rely on `supabase start` applying them implicitly).
      - name: Apply migrations to a fresh DB
        run: npx supabase db reset
      - name: Export local Supabase test env
        run: |
          npx supabase status -o env \
            | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' > sb.env
          . ./sb.env
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "PARENT_SESSION_SECRET=ci-parent-session-secret-0123456789"
          } >> "$GITHUB_ENV"
          rm -f sb.env
      - name: Run per-account isolation test
        run: npm run test
      # The built server (dist/server/entry.mjs, what the container runs) reached the way Caddy reaches it on the VPS:
      # plain HTTP + Host/X-Forwarded-*. Form POSTs must not get 403 from Astro's origin check and the confirm e-mail's
      # redirect must carry https://matmaverse.ariom.cloud (security.allowedDomains in astro.config.mjs). Reads the
      # e-mail from mailpit, which is why it stays in the stack above.
      - name: Check the origin behind the proxy (built Node server)
        run: |
          SUPABASE_KEY="$SUPABASE_ANON_KEY" HOST=127.0.0.1 PORT=4401 node dist/server/entry.mjs &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:4401/api/health && break; sleep 1; done
          BASE_URL=http://127.0.0.1:4401 PUBLIC_ORIGIN=https://matmaverse.ariom.cloud \
            MAILPIT_URL=http://127.0.0.1:54324 node scripts/check-proxy-origin.mjs

  # The production image (Dockerfile), built on every run so a broken Dockerfile fails the PR. Nothing is pushed here:
  # .github/workflows/deploy.yml builds and pushes ghcr.io/vince307/matmaverse:<sha> after CI is green on main
  # (same cache, so that build is mostly cache hits).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The VPS is amd64.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ghcr.io/vince307/matmaverse:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Browser-level journey gate (test-plan §3 Phase 5). Runs alongside `ci` (not
  # chained) so wall-clock stays bounded. Playwright's webServer starts
  # `npm run dev` on :4321 against the same local Supabase stack; retries=2 +
  # trace-on-first-retry come from playwright.config.ts (CI mode).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # mailpit included for the same reason as the `ci` job above — the e2e
      # recovery journey submits the real reset form and asserts the sent notice.
      - name: Start Supabase (local stack — db + auth + rest + mailer)
        # Pull the stack from Docker Hub: public.ecr.aws answers "toomanyrequests: Data limit exceeded" to runners.
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: >-
          npx supabase start -x
          realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Apply migrations to a fresh DB
        run: npx supabase db reset
      # playwright.config.ts reads these names (dotenv .env.test is absent in CI)
      # and maps SUPABASE_KEY for the dev-server child. The local-stack keys are
      # fixed public demo JWTs; PARENT_SESSION_SECRET is any non-empty string.
      - name: Export local Supabase test env
        run: |
          npx supabase status -o env \
            | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' > sb.env
          . ./sb.env
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "PARENT_SESSION_SECRET=ci-parent-session-secret-0123456789"
          } >> "$GITHUB_ENV"
          rm -f sb.env
      - name: Run Playwright e2e suite
        run: npx playwright test
      - name: Upload Playwright report + traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
