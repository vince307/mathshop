<!--
  Confirmation email template (Polish) for BOTH the local stack and production —
  locally by content_path (config.toml [auth.email.template.confirmation]); in
  production the image serves it at /email-templates/confirmation.html (Dockerfile)
  and the self-hosted GoTrue fetches it from there, so the environments cannot
  drift. Points at the token_hash confirm route, NOT the default
  {{ .ConfirmationURL }} PKCE link; the link shape is pinned by the confirm route
  and tests/auth-confirm.test.ts — keep it byte-compatible. `{{ .SiteURL }}` is
  the environment's auth site_url (local: localhost:4321; prod:
  ariom-infra server/supabase/matmaverse/compose.yml); `{{ .RedirectTo }}` is the signup
  `emailRedirectTo` (/app).
-->
<h2>Potwierdź swój adres e-mail</h2>
<p>Cześć! Kliknij poniższy link, aby aktywować konto w MatmaVerse:</p>
<p>
  <a href="{{ .SiteURL }}/api/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next={{ .RedirectTo }}">
    Aktywuj konto
  </a>
</p>
<p>Jeśli to nie Ty zakładałeś/aś konto, zignoruj tę wiadomość.</p>
